name: Sync Unraid Template

on:
  push:
    branches:
      - main
      - master
    paths:
      - '.unraid/**'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sonic Horizon Code
        uses: actions/checkout@v4
        with:
          path: sonic-repo

      - name: Checkout Unraid Templates Repo
        uses: actions/checkout@v4
        with:
          repository: Adman1020/unraid-templates
          token: ${{ secrets.UNRAID_SYNC_TOKEN }}
          path: unraid-templates-repo

      - name: Copy XML Template
        run: |
          cp sonic-repo/.unraid/SonicHorizon.xml unraid-templates-repo/SonicHorizon.xml

      - name: Commit and Push Changes
        run: |
          cd unraid-templates-repo
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          git add SonicHorizon.xml
          git commit -m "Update Sonic Horizon Unraid template from source" || echo "No changes to commit"
          git push origin main
