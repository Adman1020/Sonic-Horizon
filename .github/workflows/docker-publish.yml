name: Publish Docker image

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set GHCR package visibility to public
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        env:
          PACKAGE_NAME: ${{ github.repository }}
        with:
          script: |
            const packageName = process.env.PACKAGE_NAME.split('/')[1].toLowerCase();
            try {
              await github.request('PUT /user/packages/{package_type}/{package_name}/visibility', {
                package_type: 'container',
                package_name: packageName,
                visibility: 'public',
                headers: { 'X-GitHub-Api-Version': '2022-11-28' },
              });
              console.log(`Set GHCR package ${packageName} visibility to public`);
            } catch (error) {
              console.log(`Could not set package visibility (check it manually): ${error.status} ${error.message}`);
            }
