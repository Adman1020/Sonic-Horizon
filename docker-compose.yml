services:
  sonic-horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonic-horizon
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - db-data:/data/db
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/db/pde.db
      - JWT_SECRET=${JWT_SECRET:-}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - APP_BASE_URL=${APP_BASE_URL:-}
      - TZ=${TZ:-UTC}
    restart: unless-stopped

volumes:
  # The SQLite DB AND uploaded listening-data files live on a named volume,
  # NOT the bind-mounted ./config. The config mount sits on the Windows host
  # (under OneDrive), and WAL-mode SQLite on that filesystem hits
  # SQLITE_IOERR_SHORT_READ after large writes (uploads) and never recovers
  # until restart. A named volume runs on the container VM's native
  # filesystem, which fully supports WAL.
  db-data:
