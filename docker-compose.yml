services:
  sonic-horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sonic-horizon
    ports:
      - "8080:8080"
    volumes:
      - ./config:/config
      - ./uploads:/data/uploads
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/config/pde.db
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET missing - add it to .env}
      - ENCRYPTION_SECRET=${ENCRYPTION_SECRET:?ENCRYPTION_SECRET missing - add it to .env}
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI:-http://localhost:8080/api/spotify/callback}
    restart: unless-stopped
